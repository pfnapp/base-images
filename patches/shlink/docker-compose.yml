services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: local-only-root-password
      MARIADB_DATABASE: shlink
      MARIADB_USER: shlink
      MARIADB_PASSWORD: local-only-password
    volumes: ["shlink-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
  shlink:
    build: .
    image: local/pfnapp-shlink:5.1.6
    depends_on:
      db:
        condition: service_healthy
    ports: ["8082:8080"]
    environment:
      DEFAULT_DOMAIN: localhost:8082
      IS_HTTPS_ENABLED: "false"
      DB_DRIVER: maria
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD: local-only-password
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/rest/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  shlink-db:
