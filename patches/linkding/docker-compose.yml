services:
  linkding:
    build: .
    image: local/pfnapp-linkding:1.47.0
    ports: ["9090:9090"]
    environment:
      LD_SERVER_PORT: "9090"
      LD_SUPERUSER_NAME: admin
      LD_SUPERUSER_PASSWORD: local-only-password
    volumes: ["linkding-data:/etc/linkding/data"]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:9090/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  linkding-data:
