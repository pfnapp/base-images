services:
  stirling-pdf:
    build: .
    image: local/pfnapp-stirling-pdf:2.14.3
    ports: ["8083:8080"]
    environment:
      SYSTEM_DEFAULTLOCALE: en-US
      SYSTEM_CONNECTIONTIMEOUTMILLISECONDS: "120000"
      DOCKER_ENABLE_SECURITY: "false"
    volumes: ["stirling-config:/configs", "stirling-data:/customFiles"]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  stirling-config:
  stirling-data:
