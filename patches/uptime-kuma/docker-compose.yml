services:
  uptime-kuma:
    build: .
    image: local/pfnapp-uptime-kuma:2.5.5
    ports: ["3001:3001"]
    environment:
      UPTIME_KUMA_HOST: 0.0.0.0
      UPTIME_KUMA_PORT: "3001"
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes: ["uptime-kuma-data:/app/data"]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:3001/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  uptime-kuma-data:
