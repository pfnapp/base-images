services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: local-only-root-password
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-only-password
    volumes: ["wordpress-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
  wordpress-fpm:
    build: .
    image: local/pfnapp-wordpress-fpm:7.1.1-php8.3-fpm-alpine
    depends_on:
      db:
        condition: service_healthy
    ports: ["9000:9000"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-only-password
      WORDPRESS_DB_NAME: wordpress
    volumes: ["wordpress-data:/var/www/html"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  wordpress-db:
  wordpress-data:
