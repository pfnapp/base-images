server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /app;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","framework":"Vite Static (Nginx)","runtime":"Nginx Alpine"}\n';
    }

    # Static assets with cache headers
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA Routing: Fallback all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
