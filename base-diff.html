<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVE Report — PFNApp Base Images</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --card-bg:   #161b22;
      --border:    #21262d;
      --border-2:  #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --muted-2:   #6e7681;
      --blue:      #58a6ff;
      --blue-dim:  #1f6feb33;
      --red:       #f85149;
      --red-dim:   #f8514920;
      --orange:    #d29922;
      --orange-dim:#d2992220;
      --green:     #3fb950;
      --green-dim: #3fb95020;
      --yellow:    #e3b341;
      --purple:    #bc8cff;
      --radius:    8px;
      --radius-sm: 5px;
    }

    html { font-size: 14px; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                   Helvetica, Arial, sans-serif;
      line-height: 1.5; min-height: 100vh;
      max-width: 100vw; overflow-x: hidden;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

    /* ── Header ──────────────────────────────────────────────── */
    .header {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 14px 24px; position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 100%; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.80rem; color: var(--muted);
      background: var(--border); border: 1px solid var(--border-2);
      border-radius: 6px; padding: 4px 10px;
      transition: color .15s, background .15s; white-space: nowrap;
    }
    .back-link:hover { color: var(--text); background: var(--border-2); text-decoration: none; }
    .header-title { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .header-title h1 { font-size: 1rem; font-weight: 700; color: var(--text); }
    .header-title .subtitle {
      font-size: 0.76rem; color: var(--muted);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .type-badge {
      font-size: 0.68rem; font-weight: 700; padding: 1px 7px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: .04em;
    }
    .type-badge.language { background: var(--blue-dim); color: var(--blue); border: 1px solid #1f6feb50; }
    .type-badge.framework { background: var(--purple)22; color: var(--purple); border: 1px solid #bc8cff40; }
    .image-ref {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.70rem; color: var(--muted-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Summary bar ─────────────────────────────────────────── */
    .summary-bar {
      padding: 12px 24px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .summary-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--card-bg);
      font-size: 0.75rem; white-space: nowrap;
    }
    .summary-pill .snum { font-size: 0.90rem; font-weight: 700; }
    .summary-pill.red    { border-color: #da3633; background: var(--red-dim); }
    .summary-pill.orange { border-color: #9e6a03; background: var(--orange-dim); }
    .summary-pill.yellow { border-color: #9e8703; background: #e3b34120; }
    .summary-pill.gray   { border-color: var(--border-2); }
    .summary-pill.green  { border-color: #238636; background: var(--green-dim); }
    .snum.red    { color: var(--red); }
    .snum.orange { color: var(--orange); }
    .snum.yellow { color: var(--yellow); }
    .snum.green  { color: var(--green); }
    .snum.gray   { color: var(--muted); }

    /* ── Version tabs ────────────────────────────────────────── */
    .tabs-wrap {
      padding: 0 24px 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tabs {
      display: flex; gap: 0; align-items: flex-end;
      min-width: max-content;
    }
    .tab-btn {
      padding: 8px 16px; font-size: 0.78rem; font-weight: 500;
      color: var(--muted); background: transparent;
      border: none; border-bottom: 2px solid transparent;
      cursor: pointer; white-space: nowrap;
      transition: color .15s, border-color .15s;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--blue); border-bottom-color: var(--blue);
    }
    .tab-badge {
      font-size: 0.62rem; padding: 1px 5px; border-radius: 10px;
      font-family: inherit; font-weight: 700;
    }
    .tab-badge.clean  { background: var(--green-dim); color: var(--green); }
    .tab-badge.warn   { background: var(--orange-dim); color: var(--orange); }
    .tab-badge.crit   { background: var(--red-dim); color: var(--red); }
    .tab-badge.eol    { background: var(--border); color: var(--muted-2); }
    .tab-lifecycle {
      font-size: 0.60rem; color: var(--muted-2);
    }

    /* ── Toolbar ─────────────────────────────────────────────── */
    .toolbar {
      padding: 12px 24px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
    .search-icon {
      position: absolute; left: 9px; top: 50%;
      transform: translateY(-50%); color: var(--muted); pointer-events: none;
    }
    .search-input {
      width: 100%; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 0.80rem; font-family: inherit;
      padding: 6px 8px 6px 30px; outline: none; transition: border-color .15s;
    }
    .search-input::placeholder { color: var(--muted-2); }
    .search-input:focus { border-color: var(--blue); }
    .filter-select {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--muted);
      font-size: 0.80rem; font-family: inherit;
      padding: 6px 9px; outline: none; cursor: pointer;
    }
    .filter-select:focus { border-color: var(--blue); }
    .result-count { margin-left: auto; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

    /* ── Main content ────────────────────────────────────────── */
    .main { padding: 0 24px 48px; }

    /* ── Layer block ─────────────────────────────────────────── */
    .layer-block { margin-bottom: 20px; }
    .layer-title {
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted-2); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .layer-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .layer-dot.system { background: var(--muted-2); }
    .layer-dot.app    { background: var(--blue); }

    /* ── CVE table card ──────────────────────────────────────── */
    .cve-card {
      background: var(--card-bg); border: 1px solid var(--border-2);
      border-radius: var(--radius); overflow: hidden;
    }

    /* ── CVE row ─────────────────────────────────────────────── */
    .cve-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; font-size: 0.73rem;
      border-bottom: 1px solid var(--border);
      min-width: 0; overflow: hidden;
      transition: background .1s;
    }
    .cve-row:last-child { border-bottom: none; }
    .cve-row:hover { background: rgba(255,255,255,.025); }

    .cve-num {
      font-size: 0.60rem; color: var(--muted-2); width: 22px;
      flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums;
    }
    .cve-id-link {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-weight: 700; font-size: 0.70rem; white-space: nowrap; flex-shrink: 0;
    }
    .cve-id-link.CRITICAL { color: var(--red); }
    .cve-id-link.HIGH     { color: var(--orange); }
    .cve-id-link.MEDIUM   { color: var(--yellow); }
    .cve-id-link.LOW      { color: var(--muted); }

    .cve-pkg-chip {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.66rem; background: var(--border);
      border: 1px solid var(--border-2); border-radius: 3px; padding: 0 5px;
      color: var(--muted); max-width: 110px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
    }
    .cve-ver-chip {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.60rem; border-radius: 3px; padding: 0 5px;
      color: var(--muted-2); background: transparent; white-space: nowrap;
      border: 1px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; gap: 3px;
    }
    .cve-ver-chip .arrow { color: var(--green); font-size: 0.65rem; }
    .cve-title-text {
      flex: 1; min-width: 0; color: var(--muted); font-size: 0.70rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sev-pill {
      font-size: 0.58rem; font-weight: 700; padding: 1px 5px;
      border-radius: 3px; text-transform: uppercase; flex-shrink: 0;
    }
    .sev-pill.CRITICAL { background: var(--red-dim);    color: var(--red);    }
    .sev-pill.HIGH     { background: var(--orange-dim); color: var(--orange); }
    .sev-pill.MEDIUM   { background: #e3b34120;         color: var(--yellow); }
    .sev-pill.LOW      { background: var(--border);     color: var(--muted);  }

    /* ── Show more / collapse ────────────────────────────────── */
    .show-more-row {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg);
    }
    .show-more-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.73rem; color: var(--blue);
      background: transparent; border: none; cursor: pointer;
      font-family: inherit; padding: 0;
      transition: opacity .15s;
    }
    .show-more-btn:hover { opacity: .75; text-decoration: underline; }
    .show-more-hint { font-size: 0.68rem; color: var(--muted-2); }

    /* ── Empty / clean state ─────────────────────────────────── */
    .clean-card {
      background: var(--card-bg); border: 1px solid #238636;
      border-radius: var(--radius); padding: 20px 18px;
      display: flex; align-items: center; gap: 12px;
    }
    .clean-icon { font-size: 1.6rem; flex-shrink: 0; }
    .clean-text h3 { font-size: 0.85rem; color: var(--green); margin-bottom: 3px; }
    .clean-text p  { font-size: 0.73rem; color: var(--muted); }

    /* ── Notice ──────────────────────────────────────────────── */
    .notice-wrap { padding: 0 24px 10px; }

    /* ── EOL banner ──────────────────────────────────────────── */
    #eol-banner {
      margin: 0 24px 12px;
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px; border-radius: 6px;
      border: 1px solid #da363350; background: #da363312;
    }
    #eol-banner.warn    { border-color: #9e6a0350; background: #d2992212; }
    #eol-banner.lts     { border-color: #23863350; background: #23863308; }
    .eol-banner-icon    { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
    .eol-banner-body    { flex: 1; min-width: 0; }
    .eol-banner-title   { font-size: 0.75rem; font-weight: 700; color: var(--red); margin-bottom: 3px; }
    #eol-banner.warn .eol-banner-title { color: var(--orange); }
    #eol-banner.lts  .eol-banner-title { color: var(--green); }
    .eol-banner-desc    { font-size: 0.70rem; color: var(--muted); line-height: 1.55; }
    .eol-banner-desc strong { color: var(--text); }
    .notice-box {
      padding: 9px 14px;
      background: var(--blue-dim); border: 1px solid #1f6feb40;
      border-radius: var(--radius-sm); font-size: 0.72rem; color: var(--muted);
      line-height: 1.55;
    }
    .notice-box.warn {
      background: var(--orange-dim); border-color: #9e6a0340;
    }
    .notice-box strong { color: var(--text); }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.90em;
    }

    /* ── State boxes ─────────────────────────────────────────── */
    .state-box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px 24px;
      text-align: center; color: var(--muted);
      max-width: 600px; margin: 40px auto;
    }
    .state-box .icon { font-size: 2rem; margin-bottom: 10px; }
    .state-box h2 { font-size: 0.95rem; color: var(--text); margin-bottom: 8px; }
    .state-box p  { font-size: 0.80rem; line-height: 1.6; }
    .loading-spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Scanned-at info ─────────────────────────────────────── */
    .scanned-at {
      font-size: 0.68rem; color: var(--muted-2); padding: 0 24px 6px;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 640px) {
      .header { padding: 12px 16px; }
      .summary-bar, .toolbar, .main, .notice-wrap, .tabs-wrap, .scanned-at, #eol-banner { padding-left: 16px; padding-right: 16px; }
      #eol-banner { margin-left: 0; margin-right: 0; }
      .cve-ver-chip { display: none; }
      .cve-num { display: none; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="back-link">← Dashboard</a>
    <div class="header-title">
      <h1 id="page-title">CVE Report — loading…</h1>
      <div class="subtitle" id="page-subtitle"></div>
    </div>
  </div>
</header>

<!-- ── Loading ───────────────────────────────────────────────── -->
<div class="state-box" id="loading-state">
  <div class="loading-spinner"></div>
  <h2>Loading scan data…</h2>
  <p>Fetching <span class="mono">base-report.json</span></p>
</div>

<!-- ── Error ─────────────────────────────────────────────────── -->
<div class="state-box hidden" id="error-state">
  <div class="icon">⚠️</div>
  <h2 id="error-title">Could not load data</h2>
  <p id="error-msg"></p>
</div>

<!-- ── Main content ──────────────────────────────────────────── -->
<div class="hidden" id="content">

  <!-- Summary pills -->
  <div class="summary-bar" id="summary-bar"></div>

  <!-- Version tabs -->
  <div class="tabs-wrap">
    <div class="tabs" id="version-tabs"></div>
  </div>

  <!-- EOL Banner -->
  <div class="hidden" id="eol-banner"></div>

  <!-- Scanned at -->
  <div class="scanned-at" id="scanned-at"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z" fill="currentColor"/>
      </svg>
      <input type="text" class="search-input" id="search-input" placeholder="Filter by CVE ID, package, title…" />
    </div>
    <select class="filter-select" id="sev-filter">
      <option value="All">All severities</option>
      <option value="CRITICAL">🔴 Critical</option>
      <option value="HIGH">🟠 High</option>
      <option value="MEDIUM">🟡 Medium</option>
      <option value="LOW">⚪ Low</option>
    </select>
    <select class="filter-select" id="layer-filter">
      <option value="All">All layers</option>
      <option value="system">System packages</option>
      <option value="app">App packages</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>

  <!-- Notice -->
  <div class="notice-wrap">
    <div class="notice-box" id="data-notice"></div>
  </div>

  <!-- CVE body -->
  <div class="main" id="cve-main"></div>
</div>

<script>
(function () {
  'use strict';

  const GH_PAGES_BASE = (() => {
    const { origin, pathname } = location;
    const base = pathname.replace(/\/[^/]*$/, '/');
    return origin + base;
  })();
  const BASE_REPORT_URL = GH_PAGES_BASE + 'base-report.json';

  /* ── URL params ──────────────────────────────────────────── */
  const params = new URLSearchParams(location.search);
  const appId  = params.get('app') || '';
  let   appTag = params.get('tag') || '';

  /* ── State ───────────────────────────────────────────────── */
  let currentVersion  = null;   // version object from base-report.json
  let allCves         = [];     // { id, pkg, severity, title, layer, installedVersion, fixedVersion }
  let sevFilter       = 'All';
  let layerFilter     = 'All';
  let searchQuery     = '';
  // per-layer collapse state: { system: bool, app: bool }
  const expanded      = { system: false, app: false };
  const COLLAPSE_LIMIT = 5;

  /* ── Helpers ─────────────────────────────────────────────── */
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function nvdUrl(id) {
    return `https://nvd.nist.gov/vuln/detail/${encodeURIComponent(id)}`;
  }
  const SEV_ORDER = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };
  function sevSort(a, b) {
    return (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9);
  }
  function fmtDate(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
      });
    } catch { return iso; }
  }

  /* ── Show error ──────────────────────────────────────────── */
  function showError(title, msg) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent   = msg;
    document.getElementById('error-state').classList.remove('hidden');
  }

  /* ── Tab badge class ─────────────────────────────────────── */
  function tabBadgeClass(ver) {
    const total = (ver.vulnerabilities?.system?.total || 0) +
                  (ver.vulnerabilities?.app?.total    || 0);
    if (ver.lifecycleStatus === 'EOL' || ver.lifecycleStatus === 'DEPRECATED') return 'eol';
    if (total === 0) return 'clean';
    const hasCrit = (ver.vulnerabilities?.system?.critical || 0) +
                    (ver.vulnerabilities?.app?.critical    || 0) > 0;
    return hasCrit ? 'crit' : 'warn';
  }

  function tabBadgeLabel(ver) {
    const sys = ver.vulnerabilities?.system?.total || 0;
    const app = ver.vulnerabilities?.app?.total    || 0;
    const tot = sys + app;
    if (ver.lifecycleStatus === 'EOL') return 'EOL';
    if (tot === 0) return '✓ Clean';
    const hasCrit = (ver.vulnerabilities?.system?.critical || 0) +
                    (ver.vulnerabilities?.app?.critical    || 0) > 0;
    return hasCrit ? `🔴 ${tot}` : `${tot}`;
  }

  /* ── Render version tabs ─────────────────────────────────── */
  function renderTabs(image) {
    const tabs = document.getElementById('version-tabs');
    tabs.innerHTML = image.versions.map(ver => {
      const bc    = tabBadgeClass(ver);
      const bl    = tabBadgeLabel(ver);
      const active = ver.tag === appTag ? 'active' : '';
      const lc    = ver.lifecycleBadge ? `<span class="tab-lifecycle">${esc(ver.lifecycleBadge)}</span>` : '';
      return `<button class="tab-btn ${active}" data-tag="${esc(ver.tag)}" onclick="switchTab('${esc(ver.tag)}')">
        ${lc}<span class="mono">${esc(ver.tag)}</span>
        <span class="tab-badge ${bc}">${bl}</span>
      </button>`;
    }).join('');
  }

  /* ── Switch tab ──────────────────────────────────────────── */
  window.switchTab = function(tag) {
    appTag = tag;
    expanded.system = false;
    expanded.app    = false;
    // update URL without reload
    const url = new URL(location.href);
    url.searchParams.set('tag', tag);
    history.replaceState(null, '', url.toString());
    // re-activate tab button
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tag === tag);
    });
    loadTag(window._imageData, tag);
  };

  /* ── Toggle show more ────────────────────────────────────── */
  window.toggleLayer = function(layer) {
    expanded[layer] = !expanded[layer];
    renderCveBody();
  };

  /* ── Filtered CVEs ───────────────────────────────────────── */
  function getFiltered() {
    const q = searchQuery.trim().toLowerCase();
    return allCves.filter(c => {
      if (sevFilter   !== 'All' && (c.severity||'').toUpperCase() !== sevFilter) return false;
      if (layerFilter !== 'All' && c.layer !== layerFilter) return false;
      if (q) {
        const hay = [c.id, c.pkg||'', c.title||''].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  /* ── Render one CVE row ──────────────────────────────────── */
  function renderCveRow(c, idx) {
    const sev = (c.severity || 'LOW').toUpperCase();
    const fixHtml = c.fixedVersion
      ? `<span class="cve-ver-chip"><span>${esc(c.installedVersion||'')}</span><span class="arrow">→</span><span style="color:var(--green)">${esc(c.fixedVersion)}</span></span>`
      : (c.installedVersion ? `<span class="cve-ver-chip">${esc(c.installedVersion)}</span>` : '');
    return `<div class="cve-row">
      <span class="cve-num">${idx + 1}</span>
      <a class="cve-id-link ${sev}" href="${nvdUrl(c.id)}" target="_blank" rel="noopener">${esc(c.id)}</a>
      <span class="cve-pkg-chip" title="${esc(c.pkg)}">${esc(c.pkg)}</span>
      ${fixHtml}
      <span class="cve-title-text" title="${esc(c.title||'')}">${esc(c.title||'–')}</span>
      <span class="sev-pill ${sev}">${sev}</span>
    </div>`;
  }

  /* ── Render one layer section ────────────────────────────── */
  function renderLayerSection(layer, rows) {
    const label   = layer === 'system' ? 'System Packages' : 'Application Packages';
    const dotCls  = layer === 'system' ? 'system' : 'app';
    const isExp   = expanded[layer];
    const limit   = COLLAPSE_LIMIT;
    const visible = isExp ? rows : rows.slice(0, limit);
    const hidden  = rows.length - visible.length;

    if (rows.length === 0) {
      return `<div class="layer-block">
        <div class="layer-title">
          <span class="layer-dot ${dotCls}"></span>${esc(label)}
        </div>
        <div class="clean-card">
          <span class="clean-icon">✅</span>
          <div class="clean-text">
            <h3>No CVEs found</h3>
            <p>This layer has no known vulnerabilities.</p>
          </div>
        </div>
      </div>`;
    }

    const rowsHtml = visible.map((c, i) => renderCveRow(c, i)).join('');

    const showMoreHtml = rows.length > limit
      ? `<div class="show-more-row">
          <button class="show-more-btn" onclick="toggleLayer('${layer}')">
            ${isExp
              ? '↑ Collapse'
              : `↓ Show all ${rows.length} CVEs (${hidden} more)`
            }
          </button>
          <span class="show-more-hint">${rows.length} total in this layer</span>
        </div>`
      : '';

    return `<div class="layer-block">
      <div class="layer-title">
        <span class="layer-dot ${dotCls}"></span>${esc(label)}
        <span style="color:var(--muted-2);font-weight:400;text-transform:none;font-size:.72rem;letter-spacing:0">&nbsp;·&nbsp;${rows.length} CVE${rows.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="cve-card">
        ${rowsHtml}
        ${showMoreHtml}
      </div>
    </div>`;
  }

  /* ── Render CVE body ─────────────────────────────────────── */
  function renderCveBody() {
    const filtered = getFiltered();
    const sysCves  = filtered.filter(c => c.layer === 'system');
    const appCves  = filtered.filter(c => c.layer === 'app');
    const main     = document.getElementById('cve-main');
    main.innerHTML = renderLayerSection('system', sysCves) +
                     renderLayerSection('app',    appCves);
    document.getElementById('result-count').textContent =
      `${filtered.length} CVE${filtered.length !== 1 ? 's' : ''} shown`;
  }

  /* ── EOL helpers (same logic as index.html) ─────────────── */
  function fmtEolDate(dateStr) {
    if (!dateStr) return null;
    try { return new Date(dateStr).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }); }
    catch { return dateStr; }
  }
  function eolClass(eol) {
    if (!eol || !eol.date) return 'unknown';
    if (eol.isEol) return 'eol';
    const days = (new Date(eol.date) - Date.now()) / 86400000;
    return days < 180 ? 'soon' : 'ok';
  }

  /* ── EOL banner element ──────────────────────────────────── */
  function renderEolBanner(ver) {
    const eol = ver.eol;
    const el  = document.getElementById('eol-banner');
    if (!el) return;
    if (!eol || !eol.date) { el.className = 'hidden'; el.innerHTML = ''; return; }

    const cls    = eolClass(eol);
    const label  = fmtEolDate(eol.date);
    const patch  = eol.latestPatch ? ` Latest upstream: <strong>${esc(eol.latestPatch)}</strong>.` : '';
    const ltsStr = eol.isLts ? ` LTS release.` : '';

    if (cls === 'eol') {
      el.className = 'eol-banner';
      el.innerHTML = `<span class="eol-banner-icon">⛔</span>
        <div class="eol-banner-body">
          <div class="eol-banner-title">End of Life — Use at Your Own Risk</div>
          <div class="eol-banner-desc">
            This version reached End of Life on <strong>${label}</strong> and no longer receives security patches.
            Even if this scan shows zero CVEs, new vulnerabilities will not be fixed by upstream.${patch}
            <br>Migrate to a supported version.
          </div>
        </div>`;
    } else if (cls === 'soon') {
      el.className = 'eol-banner warn';
      el.innerHTML = `<span class="eol-banner-icon">⚠</span>
        <div class="eol-banner-body">
          <div class="eol-banner-title">Approaching End of Life · ${label}</div>
          <div class="eol-banner-desc">
            Security patches will stop on <strong>${label}</strong>. Plan your migration before that date.${patch}
          </div>
        </div>`;
    } else if (eol.isLts) {
      el.className = 'eol-banner lts';
      el.innerHTML = `<span class="eol-banner-icon">🔒</span>
        <div class="eol-banner-body">
          <div class="eol-banner-title">Long-Term Support · EOL ${label}</div>
          <div class="eol-banner-desc">${ltsStr} Security support until <strong>${label}</strong>.${patch}</div>
        </div>`;
    } else {
      el.className = 'hidden'; el.innerHTML = '';
    }
  }

  /* ── Update summary bar for current tag ──────────────────── */
  function renderSummary(ver) {
    const sys = ver.vulnerabilities?.system || {};
    const app = ver.vulnerabilities?.app    || {};
    const totSys = sys.total || 0;
    const totApp = app.total || 0;
    const tot    = totSys + totApp;
    const crit   = (sys.critical||0) + (app.critical||0);
    const high   = (sys.high||0)     + (app.high||0);
    const med    = (sys.medium||0)   + (app.medium||0);
    const fix    = (sys.fixable||0)  + (app.fixable||0);

    // EOL pill in summary
    let eolPill = '';
    if (ver.eol?.date) {
      const cls = eolClass(ver.eol);
      const lbl = fmtEolDate(ver.eol.date);
      const pillCls = cls === 'eol' ? 'red' : cls === 'soon' ? 'orange' : 'green';
      const icon    = cls === 'eol' ? '⛔' : cls === 'soon' ? '⚠' : (ver.eol.isLts ? '🔒 LTS' : '✓');
      eolPill = `<div class="summary-pill ${pillCls}"><span>${icon}</span><span>EOL ${lbl}</span></div>`;
    }

    let html = eolPill;
    if (tot === 0) {
      html += `<div class="summary-pill green"><span class="snum green">✓</span><span>No CVEs found</span></div>`;
    } else {
      html += `<div class="summary-pill gray"><span class="snum gray">${tot.toLocaleString()}</span><span>total CVEs</span></div>`;
      if (crit > 0) html += `<div class="summary-pill red"><span class="snum red">${crit}</span><span>critical</span></div>`;
      if (high > 0) html += `<div class="summary-pill orange"><span class="snum orange">${high}</span><span>high</span></div>`;
      if (med  > 0) html += `<div class="summary-pill yellow"><span class="snum yellow">${med}</span><span>medium</span></div>`;
      if (fix  > 0) html += `<div class="summary-pill green"><span class="snum green">${fix}</span><span>fixable</span></div>`;
    }
    document.getElementById('summary-bar').innerHTML = html;
  }

  /* ── Load a tag's CVEs (try full scan file, fallback topCves) */
  async function loadTag(image, tag) {
    currentVersion = image.versions.find(v => v.tag === tag);
    if (!currentVersion) {
      showError('Tag not found', `No version "${tag}" for "${appId}".`);
      return;
    }

    // Reset filters & show loading hint
    document.getElementById('cve-main').innerHTML =
      '<div style="padding:32px 0;text-align:center;color:var(--muted-2);font-size:.80rem;">Loading CVEs…</div>';

    renderSummary(currentVersion);
    renderEolBanner(currentVersion);

    // scanned-at
    const sa = document.getElementById('scanned-at');
    sa.textContent = currentVersion.scannedAt
      ? `Scanned: ${fmtDate(currentVersion.scannedAt)}`
      : '';

    // Try full scan file
    const tagSafe     = tag.replace(/[^a-zA-Z0-9._-]/g, '_');
    const scanUrl     = `${GH_PAGES_BASE}scans/${encodeURIComponent(appId)}/${encodeURIComponent(tagSafe)}/upstream.json`;
    let   fullData    = null;
    let   hasFullData = false;

    try {
      const res = await fetch(scanUrl);
      if (res.ok) {
        fullData    = await res.json();
        hasFullData = true;
      }
    } catch (_) {}

    // Build CVE list
    if (hasFullData) {
      const sysCves = (fullData.system?.cves || []).map(c => ({ ...c, layer: 'system' }));
      const appCves = (fullData.app?.cves    || []).map(c => ({ ...c, layer: 'app'    }));
      allCves = [...sysCves, ...appCves].sort(sevSort);
    } else {
      // fallback: topCves from base-report.json (max 5 per image)
      allCves = (currentVersion.topCves || []).map(c => ({ ...c })).sort(sevSort);
    }

    // Data notice
    const notice = document.getElementById('data-notice');
    const sys_t  = currentVersion.vulnerabilities?.system?.total || 0;
    const app_t  = currentVersion.vulnerabilities?.app?.total    || 0;
    const total  = sys_t + app_t;

    if (hasFullData) {
      notice.className = 'notice-box';
      notice.innerHTML = `<strong>✓ Full data loaded</strong> — showing all
        ${total.toLocaleString()} CVEs from
        <span class="mono">scans/${esc(appId)}/${esc(tagSafe)}/upstream.json</span>.`;
    } else if (total === 0) {
      notice.className = 'notice-box';
      notice.innerHTML = `<strong>✓ Clean image</strong> — no CVEs reported for this tag.`;
    } else {
      notice.className = 'notice-box warn';
      notice.innerHTML = `<strong>⚠ Partial data</strong> — full scan file
        (<span class="mono">scans/${esc(appId)}/${esc(tagSafe)}/upstream.json</span>)
        not yet generated. Showing top-5 preview (${allCves.length} of ${total.toLocaleString()} CVEs).
        Run the nightly scan workflow to generate complete files.`;
    }

    renderCveBody();
  }

  /* ── Wire filters ────────────────────────────────────────── */
  function wireFilters(image) {
    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderCveBody();
    });
    document.getElementById('sev-filter').addEventListener('change', e => {
      sevFilter = e.target.value;
      renderCveBody();
    });
    document.getElementById('layer-filter').addEventListener('change', e => {
      layerFilter = e.target.value;
      renderCveBody();
    });
  }

  /* ── Main init ───────────────────────────────────────────── */
  async function init(data) {
    const image = (data.baseImages || []).find(i => i.id === appId);
    if (!image) {
      showError('Image not found', `No base image with id "${appId}" in base-report.json.`);
      return;
    }

    window._imageData = image;

    // Default tag: from URL, else first version
    if (!appTag || !image.versions.find(v => v.tag === appTag)) {
      appTag = image.versions[0]?.tag || '';
    }

    // Page header
    document.getElementById('page-title').textContent = `CVE Report — ${image.name}`;
    const typeCls = image.type === 'language' ? 'language' : 'framework';
    document.getElementById('page-subtitle').innerHTML = `
      <span class="type-badge ${typeCls}">${esc(image.type)}</span>
      <span class="image-ref">${esc(image.versions.find(v => v.tag === appTag)?.imageRef || '')}</span>
    `;
    document.title = `CVE Report — ${image.name}`;

    // Render tabs
    renderTabs(image);

    // Show content
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');

    wireFilters(image);
    await loadTag(image, appTag);
  }

  /* ── Bootstrap ───────────────────────────────────────────── */
  if (!appId) {
    showError('Missing parameter', 'Expected URL param: ?app=<id>  e.g. ?app=nextjs');
    document.getElementById('loading-state').classList.add('hidden');
  } else {
    fetch(BASE_REPORT_URL)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => init(data))
      .catch(err => showError('Failed to load base-report.json', err.message));
  }
})();
</script>
</body>
</html>
