<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVE Diff — PFNApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --card-bg:   #161b22;
      --border:    #21262d;
      --border-2:  #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --muted-2:   #6e7681;
      --blue:      #58a6ff;
      --blue-dim:  #1f6feb33;
      --red:       #f85149;
      --red-dim:   #f8514920;
      --orange:    #d29922;
      --orange-dim:#d2992220;
      --green:     #3fb950;
      --green-dim: #3fb95020;
      --yellow:    #e3b341;
      --purple:    #bc8cff;
      --radius:    8px;
      --radius-sm: 5px;
      --col-left:  #1a1f28;
      --col-right: #111a15;
    }

    html { font-size: 14px; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                   Helvetica, Arial, sans-serif;
      line-height: 1.5; min-height: 100vh;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 14px 24px; position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.80rem; color: var(--muted);
      background: var(--border); border: 1px solid var(--border-2);
      border-radius: 6px; padding: 4px 10px;
      transition: color .15s, background .15s;
    }
    .back-link:hover { color: var(--text); background: var(--border-2); text-decoration: none; }
    .header-title {
      display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0;
    }
    .header-title h1 { font-size: 1rem; font-weight: 700; color: var(--text); }
    .header-title .subtitle {
      font-size: 0.76rem; color: var(--muted);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .tag-chip {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.72rem; background: var(--border);
      border: 1px solid var(--border-2); border-radius: 4px; padding: 1px 6px;
    }

    /* ── Summary bar ─────────────────────────────────────────── */
    .summary-bar {
      max-width: 1400px; margin: 0 auto; padding: 12px 24px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .summary-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--card-bg);
      font-size: 0.75rem; white-space: nowrap;
    }
    .summary-pill .snum { font-size: 0.90rem; font-weight: 700; }
    .summary-pill.red    { border-color: #da3633; background: var(--red-dim); }
    .summary-pill.orange { border-color: #9e6a03; background: var(--orange-dim); }
    .summary-pill.green  { border-color: #238636; background: var(--green-dim); }
    .summary-pill.gray   { border-color: var(--border-2); }
    .snum.red    { color: var(--red); }
    .snum.orange { color: var(--orange); }
    .snum.green  { color: var(--green); }
    .snum.gray   { color: var(--muted); }

    /* ── Filter & search toolbar ─────────────────────────────── */
    .toolbar {
      max-width: 1400px; margin: 0 auto; padding: 0 24px 12px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
    .search-icon {
      position: absolute; left: 9px; top: 50%;
      transform: translateY(-50%); color: var(--muted); pointer-events: none;
    }
    .search-input {
      width: 100%; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 0.80rem; font-family: inherit;
      padding: 6px 8px 6px 30px; outline: none; transition: border-color .15s;
    }
    .search-input::placeholder { color: var(--muted-2); }
    .search-input:focus { border-color: var(--blue); }
    .filter-select {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--muted);
      font-size: 0.80rem; font-family: inherit;
      padding: 6px 9px; outline: none; cursor: pointer;
    }
    .filter-select:focus { border-color: var(--blue); }
    .result-count { margin-left: auto; font-size: 0.75rem; color: var(--muted); }

    /* ── Legend ──────────────────────────────────────────────── */
    .legend {
      max-width: 1400px; margin: 0 auto; padding: 0 24px 10px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.72rem; color: var(--muted);
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .legend-dot.removed   { background: #3fb95035; border: 1px solid #3fb95060; }
    .legend-dot.remaining { background: var(--red-dim); border: 1px solid #da363330; }
    .legend-dot.both      { background: var(--orange-dim); border: 1px solid #9e6a0330; }

    /* ── Diff columns ────────────────────────────────────────── */
    .main { max-width: 1400px; margin: 0 auto; padding: 0 24px 48px; }
    .layer-block { margin-bottom: 28px; }
    .layer-title {
      font-size: 0.80rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted-2); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .layer-title .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot.upstream { background: var(--muted-2); }
    .dot.pfn      { background: var(--blue); }

    .diff-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .diff-col-header {
      padding: 8px 12px;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      font-size: 0.76rem; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
    }
    .diff-col-header.upstream {
      background: #1a1f28; border: 1px solid var(--border-2);
      border-bottom: none; color: var(--muted);
    }
    .diff-col-header.pfn {
      background: #111a15; border: 1px solid #238636;
      border-bottom: none; color: var(--green);
    }
    .col-count {
      font-size: 0.70rem; font-weight: 400; color: var(--muted-2);
    }

    .diff-col-body {
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      overflow: hidden;
    }
    .diff-col-body.upstream {
      border: 1px solid var(--border-2); border-top: none; background: var(--col-left);
    }
    .diff-col-body.pfn {
      border: 1px solid #238636; border-top: none; background: var(--col-right);
    }

    /* ── CVE row in diff ─────────────────────────────────────── */
    .cve-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; font-size: 0.73rem;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .cve-row:last-child { border-bottom: none; }
    .cve-row:hover { background: rgba(255,255,255,.025); }

    /* status indicator */
    .cve-row.removed   { background: #3fb95010; }
    .cve-row.remaining { background: #f8514908; }
    .cve-row.both      { background: #d2992208; }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.removed   { background: var(--green); }
    .status-dot.remaining { background: var(--red); }
    .status-dot.both      { background: var(--orange); }
    .status-dot.none      { background: var(--border-2); }

    .cve-id-link {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-weight: 700; font-size: 0.70rem; white-space: nowrap;
    }
    .cve-id-link.CRITICAL { color: var(--red); }
    .cve-id-link.HIGH     { color: var(--orange); }
    .cve-id-link.MEDIUM   { color: var(--yellow); }
    .cve-id-link.LOW      { color: var(--muted); }

    .cve-pkg-chip {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.66rem; background: var(--border);
      border: 1px solid var(--border-2); border-radius: 3px; padding: 0 4px;
      color: var(--muted); max-width: 120px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cve-title-text {
      flex: 1; min-width: 0; color: var(--muted); font-size: 0.70rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sev-pill {
      font-size: 0.58rem; font-weight: 700; padding: 1px 5px;
      border-radius: 3px; text-transform: uppercase; flex-shrink: 0;
    }
    .sev-pill.CRITICAL { background: var(--red-dim);    color: var(--red);    }
    .sev-pill.HIGH     { background: var(--orange-dim); color: var(--orange); }
    .sev-pill.MEDIUM   { background: #e3b34120;         color: var(--yellow); }
    .sev-pill.LOW      { background: var(--border);     color: var(--muted);  }

    /* empty col placeholder */
    .empty-col {
      padding: 16px 12px; text-align: center;
      color: var(--green); font-size: 0.75rem; font-weight: 600;
    }
    .empty-col .check { font-size: 1.4rem; display: block; margin-bottom: 4px; }

    /* ── Truncation notice ───────────────────────────────────── */
    .truncation-notice {
      padding: 8px 12px; font-size: 0.70rem;
      color: var(--muted-2); background: var(--border);
      border-top: 1px solid var(--border-2); text-align: center;
    }

    /* ── State boxes ─────────────────────────────────────────── */
    .state-box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px 24px;
      text-align: center; color: var(--muted);
      max-width: 600px; margin: 40px auto;
    }
    .state-box .icon { font-size: 2rem; margin-bottom: 10px; }
    .state-box h2 { font-size: 0.95rem; color: var(--text); margin-bottom: 8px; }
    .state-box p { font-size: 0.80rem; line-height: 1.6; }
    .loading-spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Data notice ─────────────────────────────────────────── */
    .data-notice {
      max-width: 1400px; margin: 0 auto; padding: 0 24px 14px;
    }
    .notice-box {
      padding: 10px 14px;
      background: var(--blue-dim); border: 1px solid #1f6feb40;
      border-radius: var(--radius-sm); font-size: 0.73rem; color: var(--muted);
      line-height: 1.55;
    }
    .notice-box strong { color: var(--text); }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 700px) {
      .header { padding: 12px 16px; }
      .summary-bar, .toolbar, .legend, .main, .data-notice { padding-left: 16px; padding-right: 16px; }
      .diff-cols { grid-template-columns: 1fr; }
      .diff-col-body.upstream { border-radius: 0 0 0 0; }
      .diff-col-header.pfn { border-radius: 0; }
    }

    .hidden { display: none !important; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="back-link">← Dashboard</a>
    <div class="header-title">
      <h1 id="page-title">CVE Diff — loading…</h1>
      <div class="subtitle" id="page-subtitle"></div>
    </div>
  </div>
</header>

<!-- ── Loading state ─────────────────────────────────────────── -->
<div class="state-box" id="loading-state">
  <div class="loading-spinner"></div>
  <h2>Loading scan data…</h2>
  <p>Fetching <span class="mono">report.json</span></p>
</div>

<!-- ── Error state ────────────────────────────────────────────── -->
<div class="state-box hidden" id="error-state">
  <div class="icon">⚠️</div>
  <h2 id="error-title">Could not load data</h2>
  <p id="error-msg"></p>
</div>

<!-- ── Main content ───────────────────────────────────────────── -->
<div class="hidden" id="content">

  <!-- Summary pills -->
  <div class="summary-bar" id="summary-bar"></div>

  <!-- Data notice -->
  <div class="data-notice">
    <div class="notice-box" id="data-notice"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z" fill="currentColor"/>
      </svg>
      <input type="text" class="search-input" id="search-input" placeholder="Filter by CVE ID, package, title…" />
    </div>
    <select class="filter-select" id="sev-filter">
      <option value="All">All severities</option>
      <option value="CRITICAL">🔴 Critical</option>
      <option value="HIGH">🟠 High</option>
      <option value="MEDIUM">🟡 Medium</option>
      <option value="LOW">⚪ Low</option>
    </select>
    <select class="filter-select" id="status-filter">
      <option value="All">All status</option>
      <option value="removed">✅ Removed in PFNApp</option>
      <option value="remaining">🔴 Still present</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="legend-dot removed"></span> Removed in PFNApp image</div>
    <div class="legend-item"><span class="legend-dot remaining"></span> Still present in PFNApp</div>
    <div class="legend-item"><span class="legend-dot both"></span> Present in both (different severity)</div>
  </div>

  <!-- Diff body -->
  <div class="main" id="diff-main"></div>
</div>

<script>
(function () {
  'use strict';

  // On gh-pages, scan details live at /scans/{app}/{tag}/*.json
  // report.json is also on gh-pages for summary data
  const GH_PAGES_BASE = (() => {
    const { origin, pathname } = location;
    // strip /diff.html or trailing filename to get base path
    const base = pathname.replace(/\/[^/]*$/, '/');
    return origin + base;
  })();
  const REPORT_URL   = GH_PAGES_BASE + 'report.json';

  /* ── Parse URL params ────────────────────────────────────── */
  const params  = new URLSearchParams(location.search);
  const appId   = params.get('app') || '';
  const appTag  = params.get('tag') || '';

  /* ── Helpers ─────────────────────────────────────────────── */
  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function nvdUrl(cveId) {
    return `https://nvd.nist.gov/vuln/detail/${encodeURIComponent(cveId)}`;
  }

  const SEV_ORDER = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };

  function sevSort(a, b) {
    return (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9);
  }

  /* ── Show error ──────────────────────────────────────────── */
  function showError(title, msg) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent   = msg;
    document.getElementById('error-state').classList.remove('hidden');
  }

  /* ── State ─────────────────────────────────────────────────*/
  let allRows = [];   // { layer, cve, upstreamOnly, pfnOnly, inBoth, status }
  let sevFilter    = 'All';
  let statusFilter = 'All';
  let searchQuery  = '';

  /* ── Build diff rows from CVE lists ─────────────────────── */
  function buildDiffRows(upstreamCves, pfnCves, layer) {
    const upMap  = new Map(upstreamCves.map(c => [c.id, c]));
    const pfnMap = new Map(pfnCves.map(c => [c.id, c]));
    const allIds = new Set([...upMap.keys(), ...pfnMap.keys()]);

    const rows = [];
    allIds.forEach(id => {
      const up  = upMap.get(id) || null;
      const pfn = pfnMap.get(id) || null;
      let status;
      if (up && !pfn)  status = 'removed';    // ✅ eliminated
      else if (!up && pfn) status = 'pfn-only';  // only in pfn (shouldn't happen often)
      else status = 'remaining';                  // still present

      rows.push({ layer, id, up, pfn, status, severity: (up||pfn).severity });
    });
    return rows;
  }

  /* ── Render a single CVE entry in a column ───────────────── */
  function renderCveEntry(cve, status) {
    if (!cve) return `<div class="cve-row"><span style="color:var(--muted-2);font-size:.7rem;padding:0 4px;">—</span></div>`;
    const sev = (cve.severity || 'LOW').toUpperCase();
    const dotCls = status === 'removed' ? 'removed' : status === 'remaining' ? 'remaining' : 'none';
    return `<div class="cve-row ${status}">
      <span class="status-dot ${dotCls}"></span>
      <a class="cve-id-link ${sev}" href="${nvdUrl(cve.id)}" target="_blank" rel="noopener">${escHtml(cve.id)}</a>
      <span class="cve-pkg-chip" title="${escHtml(cve.pkg)}">${escHtml(cve.pkg)}</span>
      <span class="cve-title-text" title="${escHtml(cve.title||'')}">${escHtml(cve.title||'–')}</span>
      <span class="sev-pill ${sev}">${sev}</span>
    </div>`;
  }

  /* ── Render diff for one layer ───────────────────────────── */
  function renderLayer(layer, rows, upstreamTotal, pfnTotal) {
    const layerRows = rows.filter(r => r.layer === layer);
    if (layerRows.length === 0 && upstreamTotal === 0) return '';

    const layerLabel  = layer === 'system' ? 'System Packages' : 'Application Packages';
    const dotCls      = 'upstream';

    const upCount  = layerRows.filter(r => r.up).length;
    const pfnCount = layerRows.filter(r => r.pfn).length;

    // Left: upstream rows
    const upHtml = layerRows.length === 0
      ? `<div class="empty-col"><span class="check">✓</span>No CVEs found</div>`
      : layerRows.map(r => renderCveEntry(r.up, r.up ? r.status : 'none')).join('');

    // Right: pfn rows (aligned with upstream)
    const pfnHtml = layerRows.length === 0
      ? `<div class="empty-col"><span class="check">✓</span>No CVEs found</div>`
      : layerRows.map(r => {
          if (r.status === 'removed') {
            return `<div class="cve-row removed" style="opacity:.45">
              <span class="status-dot removed"></span>
              <span style="color:var(--green);font-size:.70rem;font-family:monospace">${escHtml(r.id)}</span>
              <span style="color:var(--green);font-size:.70rem;margin-left:auto;">✓ Eliminated</span>
            </div>`;
          }
          return renderCveEntry(r.pfn, r.status);
        }).join('');

    const truncatedNotice = upstreamTotal > upCount
      ? `<div class="truncation-notice">
           ⚠ Showing top ${upCount} of ${upstreamTotal.toLocaleString()} upstream CVEs.
           Full raw scan available in
           <a href="${RAW_BASE}report.json" target="_blank">report.json</a>
           (top-5 per layer stored in dashboard data).
         </div>`
      : '';

    return `<div class="layer-block">
      <div class="layer-title">
        <span class="dot ${dotCls}"></span>${escHtml(layerLabel)}
      </div>
      <div class="diff-cols">
        <div>
          <div class="diff-col-header upstream">
            <span>⬡ Upstream Image</span>
            <span class="col-count">${upstreamTotal.toLocaleString()} CVEs total</span>
          </div>
          <div class="diff-col-body upstream">${upHtml}${truncatedNotice}</div>
        </div>
        <div>
          <div class="diff-col-header pfn">
            <span>🛡 PFNApp Hardened</span>
            <span class="col-count">${pfnTotal.toLocaleString()} CVEs total</span>
          </div>
          <div class="diff-col-body pfn">${pfnHtml}</div>
        </div>
      </div>
    </div>`;
  }

  /* ── Filter rows ─────────────────────────────────────────── */
  function getFilteredRows() {
    const q = searchQuery.trim().toLowerCase();
    return allRows.filter(r => {
      if (sevFilter !== 'All' && (r.severity||'').toUpperCase() !== sevFilter) return false;
      if (statusFilter !== 'All' && r.status !== statusFilter) return false;
      if (q) {
        const hay = [r.id, r.up?.pkg||'', r.pfn?.pkg||'', r.up?.title||'', r.pfn?.title||''].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  /* ── Re-render diff body ─────────────────────────────────── */
  function renderDiff(upSysTotal, upAppTotal, pfnSysTotal, pfnAppTotal) {
    const filteredRows = getFilteredRows();
    const systemRows   = filteredRows.filter(r => r.layer === 'system');
    const appRows      = filteredRows.filter(r => r.layer === 'app');
    const main         = document.getElementById('diff-main');
    main.innerHTML =
      renderLayer('system', systemRows, upSysTotal, pfnSysTotal) +
      renderLayer('app',    appRows,    upAppTotal, pfnAppTotal);
    const total = filteredRows.length;
    document.getElementById('result-count').textContent =
      `${total} CVE${total!==1?'s':''} shown`;
  }

  /* ── Main init ───────────────────────────────────────────── */
  async function init(data) {
    const app = (data.applications || []).find(a => a.id === appId);
    if (!app) { showError('App not found', `No application with id "${appId}" in report.json.`); return; }

    const ver = (app.monitoredVersions || []).find(v => v.tag === appTag);
    if (!ver) { showError('Version not found', `No version "${appTag}" for "${appId}".`); return; }

    const vuln    = ver.vulnerabilities || {};
    const up      = vuln.upstream || vuln;
    const pfnData = vuln.pfnapp || null;
    const red     = vuln.reduction || null;

    /* ── Page title ── */
    document.getElementById('page-title').textContent = `CVE Diff — ${app.name}`;
    document.getElementById('page-subtitle').innerHTML = `
      <span class="tag-chip">${escHtml(ver.tag)}</span>
      <span>Upstream vs PFNApp Hardened Image</span>
    `;
    document.title = `CVE Diff — ${app.name} ${ver.tag}`;

    /* ── Summary pills ── */
    const rs = red?.system || {};
    const summaryBar = document.getElementById('summary-bar');
    summaryBar.innerHTML = `
      <div class="summary-pill gray">
        <span class="snum gray">${(up.system?.total||0).toLocaleString()}</span>
        <span>upstream system CVEs</span>
      </div>
      <div class="summary-pill gray">
        <span class="snum gray">${(pfnData?.system?.total||0).toLocaleString()}</span>
        <span>PFNApp system CVEs</span>
      </div>
      ${(rs.total||0) < 0 ? `
      <div class="summary-pill green">
        <span class="snum green">${rs.total}</span>
        <span>system reduction</span>
      </div>
      <div class="summary-pill red">
        <span class="snum red">${rs.critical||0}</span>
        <span>critical Δ</span>
      </div>
      <div class="summary-pill orange">
        <span class="snum orange">${rs.high||0}</span>
        <span>high Δ</span>
      </div>` : ''}
    `;

    /* ── Try to fetch full scan detail files from gh-pages ── */
    const tagSafe   = appTag.replace(/[^a-zA-Z0-9._-]/g, '_');
    const scanBase  = `${GH_PAGES_BASE}scans/${encodeURIComponent(appId)}/${encodeURIComponent(tagSafe)}/`;
    const upstreamUrl = scanBase + 'upstream.json';
    const pfnUrl      = scanBase + 'pfnapp.json';

    let upstreamDetail = null;
    let pfnDetail      = null;

    try {
      const [upRes, pfnRes] = await Promise.allSettled([
        fetch(upstreamUrl).then(r => r.ok ? r.json() : Promise.reject(r.status)),
        fetch(pfnUrl).then(r => r.ok ? r.json() : Promise.reject(r.status)),
      ]);
      if (upRes.status === 'fulfilled')  upstreamDetail = upRes.value;
      if (pfnRes.status === 'fulfilled') pfnDetail      = pfnRes.value;
    } catch (_) { /* fall through to top-5 fallback */ }

    const hasFullData   = !!upstreamDetail;
    const upSysTotal    = up.system?.total || 0;
    const upAppTotal    = up.app?.total    || 0;

    // Use full CVE lists if available, else fall back to top-5 from report.json
    const upSysCves  = upstreamDetail?.system?.cves  || ver.topSystemCves || [];
    const upAppCves  = upstreamDetail?.app?.cves     || ver.topAppCves    || [];
    const pfnSysCves = pfnDetail?.system?.cves        || pfnData?.system?.topCves || [];
    const pfnAppCves = pfnDetail?.app?.cves           || pfnData?.app?.topCves    || [];

    /* ── Data notice ── */
    const shownSys  = upSysCves.length;
    const shownApp  = upAppCves.length;
    const notice    = document.getElementById('data-notice');
    if (hasFullData) {
      notice.innerHTML = `<strong>✓ Full data loaded:</strong> Showing all
        ${upSysTotal.toLocaleString()} system + ${upAppTotal.toLocaleString()} app upstream CVEs
        from <span class="mono">scans/${escHtml(appId)}/${escHtml(tagSafe)}/upstream.json</span>.
        Diff is complete and accurate.`;
    } else {
      const shown  = shownSys + shownApp;
      const actual = upSysTotal + upAppTotal;
      notice.innerHTML = `<strong>⚠ Partial data:</strong> Full scan file
        (<span class="mono">scans/${escHtml(appId)}/${escHtml(tagSafe)}/upstream.json</span>)
        not yet available — showing top-5 CVEs per layer (${shown} of ${actual.toLocaleString()}).
        Run the nightly scan workflow to generate complete files.
        Reduction totals in the summary bar are accurate.`;
      notice.style.background = 'var(--orange-dim)';
      notice.style.borderColor = '#9e6a0340';
    }

    /* ── Build all rows ── */
    allRows = [
      ...buildDiffRows(upSysCves, pfnSysCves, 'system'),
      ...buildDiffRows(upAppCves, pfnAppCves, 'app'),
    ].sort(sevSort);

    /* ── Show content ── */
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');

    renderDiff(upSysTotal, upAppTotal, pfnData?.system?.total || 0, pfnData?.app?.total || 0);

    /* ── Wire filters ── */
    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderDiff(upSysTotal, upAppTotal, pfnData?.system?.total || 0, pfnData?.app?.total || 0);
    });
    document.getElementById('sev-filter').addEventListener('change', e => {
      sevFilter = e.target.value;
      renderDiff(upSysTotal, upAppTotal, pfnData?.system?.total || 0, pfnData?.app?.total || 0);
    });
    document.getElementById('status-filter').addEventListener('change', e => {
      statusFilter = e.target.value;
      renderDiff(upSysTotal, upAppTotal, pfnData?.system?.total || 0, pfnData?.app?.total || 0);
    });
  }

  /* ── Validate params & fetch ─────────────────────────────── */
  if (!appId || !appTag) {
    showError('Missing parameters', 'Expected URL params: ?app=<id>&tag=<version>. Open this page from the dashboard card.');
    document.getElementById('loading-state').classList.add('hidden');
  } else {
    fetch(REPORT_URL)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => init(data))
      .catch(err => showError('Failed to load report.json', err.message));
  }
})();
</script>
</body>
</html>
