name: Upstream Security & Support Window Observatory

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit-upstream-templates:
    name: Audit Upstream Template Security & Lifecycle
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Aqua Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Run Upstream Observatory Scanner
        id: observatory
        run: |
          node scripts/upstream-observatory.js

      - name: Append Report to Job Summary
        if: always() && hashFiles('REPORT.md') != ''
        run: |
          cat REPORT.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Observatory Artifacts
        if: always() && hashFiles('report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: observatory-reports
          path: |
            REPORT.md
            report.json
            observatory.json

      - name: Commit and Push Observatory Updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain REPORT.md report.json observatory.json)" ]; then
            echo "Changes detected in observatory reports. Committing to main..."
            git add REPORT.md report.json observatory.json
            git commit -m "chore(observatory): update nightly upstream security report and JSON metrics"
            git push origin main
          else
            echo "No changes in observatory reports."
          fi
