name: Build & Push PFNApp Hardened Images

on:
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC, setelah observatory (02:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'observatory.json'
      - '.github/workflows/build-pfnapp-patches.yml'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate matrix from observatory.json
        id: gen
        run: |
          # Build matrix: setiap app yang punya patches/Dockerfile
          MATRIX=$(node -e "
            const fs = require('fs');
            const obs = JSON.parse(fs.readFileSync('observatory.json'));
            const items = [];
            for (const app of obs.applications) {
              const patchFile = \`patches/\${app.id}/Dockerfile\`;
              if (!fs.existsSync(patchFile)) continue;
              const tag = app.active_versions[0];
              if (!tag) continue;
              const registry = app.registry === 'docker.io' ? '' : app.registry + '/';
              const upstream = \`\${registry}\${app.image}:\${tag}\`;
              items.push({
                id: app.id,
                name: app.name,
                tag: tag,
                upstream: upstream
              });
            }
            console.log(JSON.stringify({ include: items }));
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build ${{ matrix.name }} (${{ matrix.tag }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.id }}:${{ matrix.tag }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: patches/${{ matrix.id }}
          file: patches/${{ matrix.id }}/Dockerfile
          push: true
          tags: ghcr.io/pfnapp/${{ matrix.id }}:${{ matrix.tag }}
          build-args: |
            TAG=${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,scope=${{ matrix.id }},mode=max
          provenance: false

      - name: Notify Green release webhook
        continue-on-error: true
        env:
          APP_ID: ${{ matrix.id }}
          RELEASE_TAG: ${{ matrix.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GREEN_RELEASE_WEBHOOK_URL: ${{ secrets.GREEN_RELEASE_WEBHOOK_URL }}
          GREEN_RELEASE_WEBHOOK_SECRET: ${{ secrets.GREEN_RELEASE_WEBHOOK_SECRET }}
        run: |
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          jq -cn --arg appId "$APP_ID" --arg tag "$RELEASE_TAG" --arg digest "$IMAGE_DIGEST" \
            --slurpfile obs observatory.json \
            '{appId: $appId, tag: $tag, digest: $digest, activeVersions: ([$obs[0].applications[] | select(.id == $appId) | .active_versions] | first // [])}' \
            > "$body_file"

          status=000
          for attempt in 1 2 3; do
            if [ -n "$GREEN_RELEASE_WEBHOOK_URL" ] && [ -n "$GREEN_RELEASE_WEBHOOK_SECRET" ]; then
              timestamp=$(date +%s)
              signature=$(bash scripts/sign-release-webhook.sh "$body_file" "$GREEN_RELEASE_WEBHOOK_SECRET" "$timestamp")
              if status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
                --output /dev/null --write-out '%{http_code}' \
                --request POST "$GREEN_RELEASE_WEBHOOK_URL" \
                --header 'Content-Type: application/json' \
                --header "x-pfnapp-release-timestamp: $timestamp" \
                --header "x-pfnapp-release-signature-256: $signature" \
                --data-binary "@$body_file"); then
                if [ "$status" = 200 ]; then
                  exit 0
                fi
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$attempt"
            fi
          done
          echo "::warning::Green release webhook failed after 3 attempts (HTTP $status)"

      - name: Summary
        run: |
          echo "### ✅ ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream:** \`${{ matrix.upstream }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PFNApp:** \`ghcr.io/pfnapp/${{ matrix.id }}:${{ matrix.tag }}\`" >> $GITHUB_STEP_SUMMARY
