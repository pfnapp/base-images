name: Build & Push PFNApp Hardened Images

on:
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC, setelah observatory (02:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'observatory.json'
      - '.github/workflows/build-pfnapp-patches.yml'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate matrix from observatory.json
        id: gen
        run: |
          # Build matrix: setiap app yang punya patches/Dockerfile
          MATRIX=$(node -e "
            const fs = require('fs');
            const obs = JSON.parse(fs.readFileSync('observatory.json'));
            const items = [];
            for (const app of obs.applications) {
              const patchFile = \`patches/\${app.id}/Dockerfile\`;
              if (!fs.existsSync(patchFile)) continue;
              const tag = app.active_versions[0];
              if (!tag) continue;
              const registry = app.registry === 'docker.io' ? '' : app.registry + '/';
              const upstream = \`\${registry}\${app.image}:\${tag}\`;
              items.push({
                id: app.id,
                name: app.name,
                tag: tag,
                upstream: upstream
              });
            }
            console.log(JSON.stringify({ include: items }));
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build ${{ matrix.name }} (${{ matrix.tag }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.id }}:${{ matrix.tag }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: patches/${{ matrix.id }}
          file: patches/${{ matrix.id }}/Dockerfile
          push: true
          tags: ghcr.io/pfnapp/${{ matrix.id }}:${{ matrix.tag }}
          build-args: |
            TAG=${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,scope=${{ matrix.id }},mode=max
          provenance: false

      - name: Notify Green release webhooks
        continue-on-error: true
        env:
          APP_ID: ${{ matrix.id }}
          RELEASE_TAG: ${{ matrix.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          STAGING_WEBHOOK_URL: ${{ secrets.STAGING_WEBHOOK_URL }}
          STAGING_WEBHOOK_SECRET: ${{ secrets.STAGING_WEBHOOK_SECRET }}
          PROD_WEBHOOK_URL: ${{ secrets.PROD_WEBHOOK_URL }}
          PROD_WEBHOOK_SECRET: ${{ secrets.PROD_WEBHOOK_SECRET }}
        run: |
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          jq -cn --arg appId "$APP_ID" --arg tag "$RELEASE_TAG" --arg digest "$IMAGE_DIGEST" \
            --slurpfile obs observatory.json \
            '{appId: $appId, tag: $tag, digest: $digest, activeVersions: ([$obs[0].applications[] | select(.id == $appId) | .active_versions] | first // [])}' \
            > "$body_file"

          # Each Green environment has its own secret and its own template gate;
          # one target failing never blocks the other or the build.
          for target in STAGING PROD; do
            url_var="${target}_WEBHOOK_URL"
            secret_var="${target}_WEBHOOK_SECRET"
            url=${!url_var}
            secret=${!secret_var}
            if [ -z "$url" ] || [ -z "$secret" ]; then
              echo "::warning::$target webhook secrets not set; skipped"
              continue
            fi

            status=000
            delivered=false
            for attempt in 1 2 3; do
              timestamp=$(date +%s)
              signature=$(bash scripts/sign-release-webhook.sh "$body_file" "$secret" "$timestamp")
              status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
                --output /dev/null --write-out '%{http_code}' \
                --request POST "$url" \
                --header 'Content-Type: application/json' \
                --header "x-pfnapp-release-timestamp: $timestamp" \
                --header "x-pfnapp-release-signature-256: $signature" \
                --data-binary "@$body_file") || status=000
              if [ "$status" = 200 ]; then
                delivered=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$attempt"
              fi
            done

            if [ "$delivered" = true ]; then
              echo "$target release webhook delivered"
            else
              echo "::warning::$target release webhook failed after 3 attempts (HTTP $status)"
            fi
          done

      - name: Summary
        run: |
          echo "### ✅ ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream:** \`${{ matrix.upstream }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PFNApp:** \`ghcr.io/pfnapp/${{ matrix.id }}:${{ matrix.tag }}\`" >> $GITHUB_STEP_SUMMARY

  build-hotpatch-9router:
    # Temporary image built from an upstream git commit (no upstream Docker image yet).
    # Separate from the observatory matrix: no schedule, no Green release webhook.
    name: Build 9Router hotpatch
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read TAG and REF from runtime-manifest.json
        id: manifest
        run: |
          m=patches/9router-hotpatch/runtime-manifest.json
          echo "tag=$(jq -r .version $m)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstreamRef $m)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (local, not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: patches/9router-hotpatch
          load: true
          tags: ghcr.io/pfnapp/9router-hotpatch:${{ steps.manifest.outputs.tag }}
          build-args: |
            TAG=${{ steps.manifest.outputs.tag }}
            REF=${{ steps.manifest.outputs.ref }}
          cache-from: type=gha,scope=9router-hotpatch
          cache-to: type=gha,scope=9router-hotpatch,mode=max
          provenance: false

      - name: Verify labels
        run: |
          img=ghcr.io/pfnapp/9router-hotpatch:${{ steps.manifest.outputs.tag }}
          lbl() { docker image inspect "$img" --format "{{ index .Config.Labels \"$1\" }}"; }
          [ "$(lbl org.opencontainers.image.version)" = "${{ steps.manifest.outputs.tag }}" ]
          [ "$(lbl org.opencontainers.image.revision)" = "${{ steps.manifest.outputs.ref }}" ]
          [ "$(lbl io.pfnapp.hotpatch)" = "true" ]

      - name: Smoke test (HTTP on :20128)
        run: |
          docker run -d --name hp -p 127.0.0.1:20128:20128 \
            ghcr.io/pfnapp/9router-hotpatch:${{ steps.manifest.outputs.tag }}
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:20128/ || true)
            case "$code" in 2??|3??) echo "HTTP $code"; exit 0 ;; esac
            sleep 2
          done
          docker logs hp; exit 1

      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/pfnapp/9router-hotpatch:${{ steps.manifest.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: docker push ghcr.io/pfnapp/9router-hotpatch:${{ steps.manifest.outputs.tag }}
