name: Nightly Base Image CVE Report

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Force refresh (passes --refresh to scanner script)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  scan-base-images:
    name: Scan PFNApp Base Language & Framework Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Aqua Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Run Base Image Scanner
        id: scanner
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            node scripts/base-image-scanner.js --refresh
          else
            node scripts/base-image-scanner.js
          fi

      - name: Commit and Push Base Image Report
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain base-report.json)" ]; then
            echo "Changes detected in base-report.json. Committing to main..."
            git add base-report.json
            git commit -m "chore(base-report): nightly base image CVE scan [skip ci]"
            git push origin main
          else
            echo "No changes in base-report.json."
          fi
