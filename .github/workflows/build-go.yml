name: Build and Audit Go Base Images

on:
  push:
    branches:
      - main
    paths:
      - 'languages/go/**'
      - '.github/workflows/build-go.yml'
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  issues: write

jobs:
  resolve-matrix:
    name: Resolve Go versions from matrix.json
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      default: ${{ steps.read.outputs.default }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Read versions from matrix.json
        id: read
        run: |
          VERSIONS=$(jq -c '.runtimes.go.supported' matrix.json)
          DEFAULT=$(jq -r '.runtimes.go.default' matrix.json)
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "default=$DEFAULT" >> $GITHUB_OUTPUT

  build-and-audit:
    name: Go ${{ matrix.go_version }} Alpine Build & Audit
    runs-on: ubuntu-24.04
    needs: resolve-matrix
    strategy:
      fail-fast: false
      matrix:
        go_version: ${{ fromJson(needs.resolve-matrix.outputs.versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for testing and CVE scanning
        uses: docker/build-push-action@v7
        with:
          context: languages/go
          file: languages/go/Dockerfile.alpine
          build-args: |
            GO_VERSION=${{ matrix.go_version }}
          load: true
          tags: local/go:${{ matrix.go_version }}-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Aqua Trivy vulnerability scanner
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/go:${{ matrix.go_version }}-test
          scan-type: image
          vuln-type: 'os'
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          output: trivy-report.txt

      - name: Create GitHub Issue on Trivy CVE detection
        if: failure() && steps.trivy_scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::Trivy scan detected actionable CRITICAL/HIGH vulnerabilities in go:${{ matrix.go_version }}-alpine"

          if [ -f trivy-report.txt ]; then
            echo "=== Trivy Scan Report ==="
            cat trivy-report.txt
          fi

          TARGET_IMAGE="go:${{ matrix.go_version }}-alpine"
          ISSUE_TITLE="[Security Alert] Actionable CVEs detected in ${TARGET_IMAGE}"

          echo "Checking for existing open issue for ${TARGET_IMAGE}..."
          EXISTING_ISSUE=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select((.title | contains(\"${TARGET_IMAGE}\")) and (.title | (contains(\"Security\") or contains(\"CVE\")))) | .number" | head -n 1)

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "An open issue (#${EXISTING_ISSUE}) already exists tracking vulnerabilities for ${TARGET_IMAGE}. Skipping issue creation to avoid duplicates."
            exit 0
          fi

          echo "No open issue found. Preparing issue body..."
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MAX_LINES=250
          REPORT_FILE="trivy-report.txt"

          cat <<EOF > issue-body.md
          ## 🚨 Security Alert: Actionable CVEs Detected

          Aqua Trivy detected actionable **CRITICAL** or **HIGH** vulnerabilities in image: \`${TARGET_IMAGE}\`.

          ### Build & Run Metadata
          - **Target Image:** \`${TARGET_IMAGE}\`
          - **Go Matrix Version:** \`${{ matrix.go_version }}\`
          - **Workflow:** \`${{ github.workflow }}\`
          - **Trigger:** \`${{ github.event_name }}\`
          - **Run URL:** [GitHub Actions Run #${{ github.run_id }}](${RUN_URL})
          - **Commit:** \`${{ github.sha }}\`
          - **Timestamp:** \`${TIMESTAMP}\`

          ---

          ### Trivy Scan Report
          EOF

          echo '```text' >> issue-body.md

          if [ -f "$REPORT_FILE" ] && [ -s "$REPORT_FILE" ]; then
            TOTAL_LINES=$(wc -l < "$REPORT_FILE")
            if [ "$TOTAL_LINES" -gt "$MAX_LINES" ]; then
              head -n "$MAX_LINES" "$REPORT_FILE" >> issue-body.md
              echo "" >> issue-body.md
              echo "... [Report truncated. Showing first ${MAX_LINES} lines of ${TOTAL_LINES}. See full workflow log for complete details] ..." >> issue-body.md
            else
              cat "$REPORT_FILE" >> issue-body.md
            fi
          else
            echo "No detailed scan report was generated or scan failed before writing." >> issue-body.md
          fi

          echo '```' >> issue-body.md

          cat << 'EOF' >> issue-body.md

          ---
          *Automated alert created by CI/CD CVE Governance pipeline.*
          EOF

          echo "Ensuring required labels exist..."
          for label in "security" "cve" "automated"; do
            gh label create "$label" --repo "${{ github.repository }}" --force 2>/dev/null || true
          done

          echo "Creating new GitHub Issue..."
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md \
            --label "security" \
            --label "cve" \
            --label "automated" || \
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md

      - name: Run container verification test
        run: |
          docker run -d --name test-container -p 8080:8080 local/go:${{ matrix.go_version }}-test
          sleep 3
          curl -fsS http://127.0.0.1:8080/ || (docker logs test-container && exit 1)
          UID_CHECK=$(docker exec test-container id -u)
          if [ "$UID_CHECK" != "10001" ]; then
            echo "Security check failed: Process running as UID $UID_CHECK (expected 10001)"
            exit 1
          fi
          docker rm -f test-container

      - name: Report image size metrics to job summary
        run: |
          SRC_IMAGE="local/go:${{ matrix.go_version }}-test"
          UNCOMPRESSED=$(docker images "$SRC_IMAGE" --format "{{.Size}}")
          COMPRESSED=$(docker save "$SRC_IMAGE" | gzip | wc -c | awk '{printf "%.1f MB", $1/1024/1024}')
          echo "### 📦 Image Size Metrics: Go ${{ matrix.go_version }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Download Size (Compressed)** | ~${COMPRESSED} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Disk Size (Uncompressed)** | ${UNCOMPRESSED} |" >> $GITHUB_STEP_SUMMARY

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push production images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          TARGET_REPO="ghcr.io/pfnapp/base/languages/go"
          SRC_IMAGE="local/go:${{ matrix.go_version }}-test"

          docker tag "$SRC_IMAGE" "${TARGET_REPO}:${{ matrix.go_version }}-alpine"
          docker tag "$SRC_IMAGE" "${TARGET_REPO}:${{ matrix.go_version }}"

          push_with_retry() {
            local tag="$1"
            local attempt=1
            while [ $attempt -le 3 ]; do
              echo "Pushing $tag (attempt $attempt)..."
              if docker push "$tag"; then
                return 0
              fi
              echo "Push failed. Retrying in 5 seconds..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "Failed to push $tag after 3 attempts."
            return 1
          }

          push_with_retry "${TARGET_REPO}:${{ matrix.go_version }}-alpine"
          push_with_retry "${TARGET_REPO}:${{ matrix.go_version }}"

          if [ "${{ matrix.go_version }}" = "${{ needs.resolve-matrix.outputs.default }}" ]; then
            docker tag "$SRC_IMAGE" "${TARGET_REPO}:latest"
            push_with_retry "${TARGET_REPO}:latest"
          fi
