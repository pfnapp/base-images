name: Build and Audit Python Base Images

on:
  push:
    branches:
      - main
    paths:
      - 'languages/python/**'
      - '.github/workflows/build-python.yml'
      - '.trivyignore'
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  issues: write

jobs:
  build-and-audit:
    name: Python ${{ matrix.python_version }} Slim Build & Audit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.12', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for testing and CVE scanning
        uses: docker/build-push-action@v7
        with:
          context: languages/python
          file: languages/python/Dockerfile.slim
          build-args: |
            PYTHON_VERSION=${{ matrix.python_version }}
          load: true
          tags: local/python:${{ matrix.python_version }}-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Aqua Trivy vulnerability scanner
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/python:${{ matrix.python_version }}-test
          scan-type: image
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          output: trivy-report.txt

      - name: Create GitHub Issue on Trivy CVE detection
        if: failure() && steps.trivy_scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::Trivy scan detected actionable CRITICAL/HIGH vulnerabilities in python:${{ matrix.python_version }}-slim"

          if [ -f trivy-report.txt ]; then
            echo "=== Trivy Scan Report ==="
            cat trivy-report.txt
          fi

          TARGET_IMAGE="python:${{ matrix.python_version }}-slim"
          ISSUE_TITLE="[Security Alert] Actionable CVEs detected in ${TARGET_IMAGE}"

          echo "Checking for existing open issue for ${TARGET_IMAGE}..."
          EXISTING_ISSUE=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq ".[] | select((.title | contains(\"${TARGET_IMAGE}\")) and (.title | (contains(\"Security\") or contains(\"CVE\")))) | .number" | head -n 1)

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "An open issue (#${EXISTING_ISSUE}) already exists tracking vulnerabilities for ${TARGET_IMAGE}. Skipping issue creation to avoid duplicates."
            exit 0
          fi

          echo "No open issue found. Preparing issue body..."
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MAX_LINES=250
          REPORT_FILE="trivy-report.txt"

          cat <<EOF > issue-body.md
          ## 🚨 Security Alert: Actionable CVEs Detected

          Aqua Trivy detected actionable **CRITICAL** or **HIGH** vulnerabilities in image: \`${TARGET_IMAGE}\`.

          ### Workflow Execution Context
          - **Timestamp**: \`${TIMESTAMP}\`
          - **Trigger**: \`${{ github.event_name }}\`
          - **Target Image**: \`${TARGET_IMAGE}\`
          - **Action Run**: [View GitHub Actions Run](${RUN_URL})

          ### Trivy Scan Summary
          \`\`\`text
          EOF

          if [ -f "$REPORT_FILE" ]; then
            TOTAL_LINES=$(wc -l < "$REPORT_FILE")
            if [ "$TOTAL_LINES" -gt "$MAX_LINES" ]; then
              head -n "$MAX_LINES" "$REPORT_FILE" >> issue-body.md
              echo "" >> issue-body.md
              echo "... [Report truncated. Showing first ${MAX_LINES} lines of ${TOTAL_LINES}. See full workflow log for complete details] ..." >> issue-body.md
            else
              cat "$REPORT_FILE" >> issue-body.md
            fi
          else
            echo "No detailed scan report was generated or scan failed before writing." >> issue-body.md
          fi

          echo '```' >> issue-body.md

          cat << 'EOF' >> issue-body.md

          ---
          *Automated alert created by CI/CD CVE Governance pipeline.*
          EOF

          echo "Ensuring required labels exist..."
          for label in "security" "cve" "automated"; do
            gh label create "$label" --repo "${{ github.repository }}" --force 2>/dev/null || true
          done

          echo "Creating new GitHub Issue..."
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md \
            --label "security" \
            --label "cve" \
            --label "automated" || \
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md

      - name: Run container verification test
        run: |
          docker run -d --name test-container -p 8080:8080 local/python:${{ matrix.python_version }}-test
          sleep 3
          curl -fsS http://127.0.0.1:8080/ || (docker logs test-container && exit 1)
          UID_CHECK=$(docker exec test-container id -u)
          if [ "$UID_CHECK" != "10001" ]; then
            echo "Security check failed: Process running as UID $UID_CHECK (expected 10001)"
            exit 1
          fi
          docker exec test-container python3 --version
          docker rm -f test-container

      - name: Report image size metrics to job summary
        run: |
          SRC_IMAGE="local/python:${{ matrix.python_version }}-test"
          UNCOMPRESSED=$(docker images "$SRC_IMAGE" --format "{{.Size}}")
          COMPRESSED=$(docker save "$SRC_IMAGE" | gzip | wc -c | awk '{printf "%.1f MB", $1/1024/1024}')
          echo "### 📦 Image Size Metrics: Python ${{ matrix.python_version }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Download Size (Compressed)** | ~${COMPRESSED} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Disk Size (Uncompressed)** | ${UNCOMPRESSED} |" >> $GITHUB_STEP_SUMMARY

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push production images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          TARGET_REPO="ghcr.io/pfnapp/base/languages/python"
          SRC_IMAGE="local/python:${{ matrix.python_version }}-test"

          docker tag "$SRC_IMAGE" "${TARGET_REPO}:${{ matrix.python_version }}-slim"
          docker tag "$SRC_IMAGE" "${TARGET_REPO}:${{ matrix.python_version }}"

          push_with_retry() {
            local tag="$1"
            local attempt=1
            while [ $attempt -le 3 ]; do
              echo "Pushing $tag (attempt $attempt)..."
              if docker push "$tag"; then
                return 0
              fi
              echo "Push failed. Retrying in 5 seconds..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "Failed to push $tag after 3 attempts."
            return 1
          }

          push_with_retry "${TARGET_REPO}:${{ matrix.python_version }}-slim"
          push_with_retry "${TARGET_REPO}:${{ matrix.python_version }}"

          if [ "${{ matrix.python_version }}" = "3.12" ]; then
            docker tag "$SRC_IMAGE" "${TARGET_REPO}:latest"
            push_with_retry "${TARGET_REPO}:latest"
          fi
