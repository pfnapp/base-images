name: Nightly Security Scan

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC every night
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Force refresh Trivy cache (--refresh)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  scan:
    name: Scan & Publish to gh-pages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Aqua Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run upstream observatory scanner
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            node scripts/upstream-observatory.js --refresh
          else
            node scripts/upstream-observatory.js
          fi

      - name: Run base image scanner
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            node scripts/base-image-scanner.js --refresh
          else
            node scripts/base-image-scanner.js
          fi

      - name: Append report to job summary
        if: always() && hashFiles('REPORT.md') != ''
        run: cat REPORT.md >> $GITHUB_STEP_SUMMARY

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          retention-days: 30
          path: |
            REPORT.md
            report.json
            base-report.json
            observatory.json

      # ── Commit observatory.json + REPORT.md back to main ──────────────────
      # Only these two files belong in main (config state + markdown audit).
      # report.json and base-report.json go to gh-pages only.
      - name: Commit observatory state to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain REPORT.md observatory.json)" ]; then
            git add REPORT.md observatory.json
            git commit -m "chore(observatory): nightly upstream security report [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in observatory state, skipping commit."
          fi

      # ── Checkout gh-pages into a subdirectory ─────────────────────────────
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-out
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Sync scan data only to gh-pages ──────────────────────────────────
      # index.html and diff.html are static UI — they are deployed separately
      # by deploy-dashboard.yml only when docs/ changes. Do NOT copy them here
      # or every nightly scan will overwrite any UI fixes made on docs/.
      - name: Sync scan reports to gh-pages
        run: |
          cp report.json        gh-pages-out/report.json
          cp base-report.json   gh-pages-out/base-report.json 2>/dev/null || true

      - name: Sync scan detail files to gh-pages
        run: |
          if [ -d scan-details ]; then
            rsync -a --delete scan-details/ gh-pages-out/scans/
          fi

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages-out
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed in gh-pages, skipping commit."
          else
            SCAN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: nightly scan — ${SCAN_DATE}"
            git push origin gh-pages
          fi
