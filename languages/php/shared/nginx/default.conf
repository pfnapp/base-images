server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Health check endpoint for ingress / load balancer
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Exploit traps: Drop automated scanner bot requests immediately (HTTP 444 No Response)
    location ~* ^/(wp-admin|wp-login|phpmyadmin|xmlrpc\.php|pma|adminer)(\.php)?(/|$) {
        return 444;
    }

    # Block sensitive directories and files
    location ~* /(vendor|node_modules|storage|bootstrap/cache|\.env|\.git|\.svn|\.htaccess|composer\.(json|lock)|package\.(json|lock)|yarn\.lock)$ {
        deny all;
        return 404;
    }

    # Block configuration files, system logs, and backup files
    location ~* \.(ini|conf|config|log|bak|backup|old|tmp|temp|swp|swo|~)$ {
        deny all;
        return 404;
    }

    # Protect internal PHP-FPM status/ping endpoints from external ingress
    location ~ ^/(status|ping)$ {
        allow 127.0.0.1;
        deny all;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        try_files $fastcgi_script_name =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300s;
    }

    # Deny access to hidden files and sensitive directories
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
