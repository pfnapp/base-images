server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Health check endpoint for ingress / load balancer
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ACME Challenge Support
    location /.well-known/acme-challenge/ {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Exploit traps: Drop automated scanner bot requests immediately (HTTP 444 No Response)
    location ~* ^/(wp-admin|wp-login|phpmyadmin|xmlrpc\.php|pma|adminer)(\.php)?(/|$) {
        return 444;
    }

    # Block sensitive directories and files
    location ~* /(vendor|node_modules|storage|bootstrap/cache|\.env|\.git|\.svn|\.htaccess|composer\.(json|lock)|package\.(json|lock)|yarn\.lock)$ {
        deny all;
        return 404;
    }

    # Block configuration files, system logs, and backup files
    location ~* \.(ini|conf|config|log|bak|backup|old|tmp|temp|swp|swo|~)$ {
        deny all;
        return 404;
    }

    # Static Asset Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Protect internal PHP-FPM status/ping endpoints from external ingress
    location ~ ^/(status|ping)$ {
        allow 127.0.0.1;
        deny all;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Restrict FastCGI execution strictly to index.php
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300s;

        # Proxy forwarding headers and HTTPoxy mitigation
        fastcgi_param HTTP_X_FORWARDED_PROTO $fastcgi_param_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $fastcgi_param_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $fastcgi_param_port;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $fastcgi_param_port;
        fastcgi_param REQUEST_SCHEME $fastcgi_param_proto;
        fastcgi_param HTTPS $fastcgi_param_https if_not_empty;
        fastcgi_param HTTP_PROXY ""; # HTTPoxy vulnerability prevention
    }

    # Block direct access to any other PHP files
    location ~ \.php$ {
        return 404;
    }

    # Support user-defined location blocks and proxy passes mounted via ConfigMap / volume
    include /etc/nginx/conf.d/custom/routes-*.conf;

    # Deny access to hidden files and sensitive directories
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
