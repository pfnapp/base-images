pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Request buffer limits (Slowloris and DoS mitigation)
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 64M;

    # Non-root unprivileged temporary paths
    client_body_temp_path /tmp/nginx/client_temp 1 2;
    proxy_temp_path       /tmp/nginx/proxy_temp 1 2;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp 1 2;
    scgi_temp_path        /tmp/nginx/scgi_temp 1 2;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Reverse proxy header mapping (detect HTTPS and forward headers from upstream reverse proxies)
    map $http_x_forwarded_proto $fastcgi_param_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $fastcgi_param_proto $fastcgi_default_port {
        ~*https 443;
        default $server_port;
    }

    map $http_x_forwarded_port $fastcgi_param_port {
        default $http_x_forwarded_port;
        ''      $fastcgi_default_port;
    }

    map $http_x_forwarded_host $fastcgi_param_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    map $fastcgi_param_proto $fastcgi_param_https {
        ~*https on;
        default $https;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/conf.d/custom/http-*.conf;
    include /etc/nginx/conf.d/custom/server-*.conf;
}
