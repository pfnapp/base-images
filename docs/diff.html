<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVE Diff — PFNApp</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="diff.css" />
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="back-link">← Dashboard</a>
    <div class="header-title">
      <h1 id="page-title">CVE Diff — loading…</h1>
      <div class="subtitle" id="page-subtitle"></div>
    </div>
  </div>
</header>

<!-- ── Loading state ─────────────────────────────────────────── -->
<div class="state-box" id="loading-state">
  <div class="loading-spinner"></div>
  <h2>Loading scan data…</h2>
  <p>Fetching <span class="mono">report.json</span></p>
</div>

<!-- ── Error state ────────────────────────────────────────────── -->
<div class="state-box hidden" id="error-state">
  <div class="icon">⚠️</div>
  <h2 id="error-title">Could not load data</h2>
  <p id="error-msg"></p>
</div>

<!-- ── Main content ───────────────────────────────────────────── -->
<div class="hidden" id="content">

  <!-- Summary pills -->
  <div class="summary-bar" id="summary-bar"></div>

  <!-- Data notice -->
  <div class="data-notice">
    <div class="notice-box" id="data-notice"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z" fill="currentColor"/>
      </svg>
      <input type="text" class="search-input" id="search-input" placeholder="Filter by CVE ID, package, title…" />
    </div>
    <select class="filter-select" id="sev-filter">
      <option value="All">All severities</option>
      <option value="CRITICAL">🔴 Critical</option>
      <option value="HIGH">🟠 High</option>
      <option value="MEDIUM">🟡 Medium</option>
      <option value="LOW">⚪ Low</option>
    </select>
    <select class="filter-select" id="status-filter">
      <option value="All">All status</option>
      <option value="removed">✅ Removed in PFNApp</option>
      <option value="remaining">🔴 Still present</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="legend-dot removed"></span> Removed in PFNApp image</div>
    <div class="legend-item"><span class="legend-dot remaining"></span> Still present in PFNApp</div>
    <div class="legend-item"><span class="legend-dot both"></span> Present in both (different severity)</div>
  </div>

  <!-- Diff body -->
  <div class="main" id="diff-main"></div>
</div>

<script src="diff.js"></script>
</body>
</html>
